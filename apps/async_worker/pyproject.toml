[project]
name = "async-worker"
version = "0.1.0"
description = "IKG FastAPI and asynchronous worker app"
requires-python = ">=3.13"
dependencies = [
    "ai-core",
    "celery[redis]>=5.6.0",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.1",
    "numpy>=2.3.5",
    "pydantic>=2.12.5",
    "uvicorn>=0.38.0",
]

[tool.uv.sources]
ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/async_worker"]
