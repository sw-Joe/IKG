[project]
name = "ikg"
version = "0.2.0"
description = "IKG workspace"
readme = "README.md"
requires-python = ">=3.13"

[tool.uv.workspace]
members = [
    "apps/async_worker",
    "packages/ai_core",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.12",
]


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ai_core", "async_worker"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
