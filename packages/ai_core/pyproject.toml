[project]
name = "ai-core"
version = "0.1.0"
description = "IKG AI inference, indexing, and search core"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.13.2",
    "numpy>=2.3.5",
    "onnxruntime>=1.25.1",
    "optimum[exporters,onnxruntime]>=2.1.0",
    "playwright>=1.59.0",
    "rank-bm25>=0.2.2",
    "tokenizers>=0.22.2",
    "trafilatura>=2.0.0",
    "transformers>=4.57.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_core"]
